<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal K Alarms</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="profile-bar">
    <label for="profile-select">Profile</label>
    <select id="profile-select">
      <option value="Default">Default</option>
    </select>
    <button id="save-btn" type="button">Save</button>
    <button id="save-as-btn" type="button">Save as...</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="zones" type="button">Zones</button>
    <button class="tab-btn" data-tab="notifications" type="button">Notifications</button>
  </nav>

  <main>
    <section id="tab-zones" class="tab-panel active">
      <div class="filter-bar">
        <input type="text" id="zones-search" placeholder="Search paths..." />
        <select id="zones-source-filter">
          <option value="">All sources</option>
        </select>
      </div>
      <div id="global-actions" class="global-actions"></div>
      <div id="zones-list" class="path-list">
        <p class="placeholder">Loading paths...</p>
      </div>
    </section>
    <section id="tab-notifications" class="tab-panel">
      <div class="notif-default-bar">
        <label for="notif-default-sound">Default sound (used when a notification's path/state isn't mapped below)</label>
        <select id="notif-default-sound">
          <option value="">(none configured)</option>
        </select>
        <button id="notif-refresh-sounds-btn" type="button">Refresh list</button>
      </div>
      <div id="notif-rows" class="notif-rows">
        <p class="placeholder">Loading notification config...</p>
      </div>
      <button id="notif-add-row-btn" type="button" class="add-zone-btn">Add path/state binding</button>
      <div class="notif-save-section">
        <button id="notif-save-btn" type="button" class="commit-btn">Save</button>
        <span id="notif-save-status" class="commit-status"></span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
